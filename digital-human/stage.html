<!doctype html>
<html lang="zh-CN" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b29"><link rel="icon" href="data:,"><title>DeepseekChan · 鲸语视频通话</title><link rel="stylesheet" href="/motions/phone/call.css"></head>
<body><main id="phone" data-phase="incoming" data-activity="idle">
<div id="figure"></div><div class="shade"></div>
<header><span class="brand"><span class="brandmark">◒</span> 鲸语</span><span class="call-type"><i data-icon="video"></i> 视频通话</span></header>
<section class="identity"><h1>DeepseekChan</h1><p id="callState" role="status">邀请你视频通话</p></section>
<section class="livehead"><div><h2>DeepseekChan <span class="person-badge">AI 伙伴</span></h2><p><i class="dot"></i><time id="timer">00:00</time><span id="modeLabel">陪你聊聊</span></p></div><div class="head-actions"><button id="captions" aria-label="隐藏字幕" aria-pressed="true" title="字幕"><i data-icon="captions"></i></button><button id="more" aria-label="打开对话与互动" title="对话与互动"><i data-icon="more"></i></button></div></section>
<div id="subtitles" aria-live="polite"><p id="question"></p><p id="answer"></p></div>
<div class="incoming-footer"><p>接通之后，直接和她说话</p><div class="incoming controls"><button id="decline"><b class="red"><i data-icon="end"></i></b>拒绝</button><button id="accept"><b class="green"><i data-icon="phone"></i></b>接听</button></div></div>
<section class="connected"><div class="presence"><span class="soundmark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><p id="hint" role="status">可以直接说话</p><button id="takeTurn" hidden>我来说</button></div>
<form id="form" hidden><input id="text" maxlength="500" aria-label="给DeepseekChan发文字" placeholder="想和DeepseekChan说什么…" autocomplete="off"><button aria-label="发送"><i data-icon="send"></i></button></form>
<nav class="controls" aria-label="通话控制"><button id="micToggle" aria-pressed="false"><b><i data-icon="mic"></i></b><span>麦克风</span></button><button id="speaker" aria-pressed="true"><b><i data-icon="volume"></i></b><span>扬声器</span></button><button id="keyboard" aria-expanded="false"><b><i data-icon="keyboard"></i></b><span>键盘</span></button><button id="hang"><b class="red"><i data-icon="end"></i></b><span>挂断</span></button></nav></section>
<div class="ended controls"><button id="redial"><b class="green"><i data-icon="phone"></i></b>再次呼叫</button><button id="review" hidden><b><i data-icon="captions"></i></b>通话复盘</button></div><div class="homebar"></div>
<dialog id="panel" aria-labelledby="panelTitle"><div class="panel-top"><div><h2 id="panelTitle">对话与互动</h2></div><button id="closePanel" aria-label="关闭对话与互动"><i data-icon="close"></i></button></div>
<div class="quick-actions"><button data-say="挥挥手">打个招呼 <span>↗</span></button><button data-say="笑一个">笑一个 <span>☺</span></button><button id="quiet" data-say="安静陪我一会儿">安静陪伴 <span>☾</span></button></div>
<p class="section-label">通话实测 · 末音到首声（浏览器估算）</p><p id="summary"></p><div class="quick-actions"><button id="markEcho">我听到了回声</button><button id="copyResults">复制本次结果</button></div><textarea id="copyText" aria-label="通话结果" hidden readonly></textarea><div id="conversation"><p class="empty">聊过的话，会留在这里。</p></div></dialog>
<div hidden><input id="viewer" value="我"><span id="source"></span><ul id="history"></ul><span id="status"></span><span id="timing"></span><button id="mic"></button><button id="stop"></button></div>
</main><script type="module" src="/motions/phone/call.js"></script></body></html>
