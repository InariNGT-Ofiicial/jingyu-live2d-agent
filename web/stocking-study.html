<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸语 · 袜口拖拽实验</title>
<style>body{margin:0;background:#edf2ed;color:#25483e;font:16px system-ui}main{max-width:960px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,420px) 340px;gap:30px}canvas{width:100%;height:auto;background:radial-gradient(#fff,#dce8df);border-radius:24px;touch-action:none;cursor:grab}aside{padding-top:40px}h1{font-size:26px}p{line-height:1.8}button,a{color:inherit}button{padding:12px 20px;border:1px solid #8ba69b;border-radius:12px;background:#fff;cursor:pointer}input{width:100%}.note{font-size:14px;color:#6b7e73}#status{min-height:3em}@media(max-width:700px){main{grid-template-columns:1fr}aside{padding-top:0}canvas{height:auto}}</style>
<main><canvas id="stage" width="420" height="800" aria-label="抓住袜口向下拖动的单腿实验"></canvas><aside><a href="/">← 返回工作台</a><h1>抓住袜口，向下拉</h1><p>拖动腿上的袜口圆环。向下拉会露出皮肤，袜口出现收拢褶皱；向上拉可以穿回。松手保留当前位置。</p><p id="status" role="status">正在加载素材…</p><label>拖拽进度<input id="progress" type="range" min="0" max="1" step="0.001" value="0"></label><p><button id="reset">重新穿上</button></p><p class="note">独立素材与交互实验，并非角色本体。裸腿为新绘素材；袜料和褶皱为程序绘制示意。尚未绑定原模型的 UV、腿部变形、裙摆遮挡和鞋子。</p></aside></main><script type="module" src="/stocking-study.mjs"></script></html>
