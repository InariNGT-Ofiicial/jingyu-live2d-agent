<!doctype html><html lang="zh"><meta charset="utf-8"><title>鲸语 · 社区动作调试台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#25473c;font:15px system-ui}main{max-width:1150px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(330px,1fr);gap:24px}section{background:white;border-radius:16px;padding:18px}canvas{width:100%;height:auto;position:sticky;top:0}label{display:block;margin:5px}button,select,input,textarea{font:inherit}button{margin:5px;padding:6px 12px}#sliders,#parts{max-height:300px;overflow:auto}summary{cursor:pointer;font-weight:bold;padding:9px}textarea{width:100%;height:110px}#status{white-space:pre-wrap}@media(max-width:700px){main{display:block}canvas{max-height:36vh;object-fit:contain}}</style>
<main><section><h1>社区动作调试台</h1><p>拖动滑杆或切换配饰，在左侧模型预览。录制完成后可保存为鲸语预设。</p><canvas id="stage"></canvas></section><section>
<details open><summary>动作滑杆</summary><div id="sliders"></div></details><details><summary>配饰开关</summary><div id="wear"></div></details><details><summary>模型部件透明度 · 仅预览</summary><div id="parts"></div></details>
<label>名称 <input id="name" value="手调表演"></label><button id="record" disabled>开始录制</button><button id="stop" disabled>结束录制</button><button id="download" disabled>下载录制 JSON</button>
<hr><label>来源 <select id="source"><option value="tuner">动作调试台 timeline-v1</option><option value="dsh">DSH 语义帧</option><option value="maibot">MaiBot 消息</option></select></label><input id="file" type="file" accept=".json"><textarea id="payload" aria-label="社区输入 JSON"></textarea>
<button id="save">校验并保存为预设</button><p id="status" role="status">正在加载模型</p><a href="/">返回工作台</a></section></main>
<script src="vendor/live2dcubismcore.min.js"></script><script src="vendor/pixi.min.js"></script><script src="vendor/cubism4.colors.min.js"></script><script type="module" src="community-ui.mjs"></script></html>
